version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vlearn_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_MODEL=gemini-2.0-flash-lite
      - DEFAULT_AI_PROVIDER=gemini
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vlearn_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
