version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vlearn_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vlearn_db
      - POSTGRES_USER=vlearn_user
      - POSTGRES_PASSWORD=vlearn_password
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vlearn_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=vlearn_db
      - POSTGRES_USER=vlearn_user
      - POSTGRES_PASSWORD=vlearn_password
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vlearn_frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://vlearn_backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
